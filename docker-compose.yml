# Self-hosted stack: PostgreSQL, one-shot migrations, web, and worker.
# Usage: cp .env.example .env && docker compose up -d --build
x-app: &app
  image: codereviewer:latest
  env_file: .env
  environment:
    DATABASE_URL: postgres://codereviewer:${POSTGRES_PASSWORD:-codereviewer}@postgres:5432/codereviewer
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codereviewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codereviewer}
      POSTGRES_DB: codereviewer
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only, for local development and backups.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereviewer -d codereviewer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    build: .
    command: ["node", "dist/db/migrate.mjs"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "dist/worker/index.mjs"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
