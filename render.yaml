# Render Blueprint: web service, background worker, and PostgreSQL.
# New > Blueprint in the Render dashboard, then fill in the variables marked sync: false.
databases:
  - name: codereviewer-db
    databaseName: codereviewer
    user: codereviewer
    plan: basic-256mb

envVarGroups:
  - name: codereviewer
    envVars:
      - key: APP_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: COMPANY_NAME
        sync: false

services:
  - type: web
    name: codereviewer-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: node dist/db/migrate.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codereviewer-db
          property: connectionString
      - fromGroup: codereviewer

  - type: worker
    name: codereviewer-worker
    runtime: docker
    plan: starter
    dockerCommand: node dist/worker/index.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codereviewer-db
          property: connectionString
      - fromGroup: codereviewer
