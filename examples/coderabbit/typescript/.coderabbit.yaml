# CodeRabbit configuration for a TypeScript project
# Target: TypeScript monorepo or app with React on the front end and Node on the back.
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: "Review as a senior TypeScript engineer. Favor type-level fixes over runtime checks, and say plainly when a type is lying about reality."

reviews:
  profile: "chill"
  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  related_issues: true
  suggested_labels: true

  path_filters:
    - "src/**"
    - "apps/**"
    - "packages/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/coverage/**"
    - "!**/*.d.ts"
    - "!**/*.generated.ts"
    - "!**/generated/**"
    - "!pnpm-lock.yaml"
    - "!package-lock.json"

  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: |
        Review this TypeScript with these priorities:
          - Flag `any`, and flag `as` casts that discard information. Suggest `unknown` plus narrowing, or a discriminated union.
          - Flag non-null assertions (`!`) where a guard or an early return would be safer.
          - Prefer types that make invalid states unrepresentable over runtime validation after the fact.
          - Require exhaustive `switch` handling on union types, with a `never` check in the default branch.
          - Flag unhandled promise rejections and floating promises.
          - Flag exported functions whose public signature is implicitly typed, where an explicit return type would document intent.
          - Flag `enum` where a union of string literals or `as const` object would be simpler.
    - path: "**/*.tsx"
      instructions: |
        This is React. Additionally:
          - Check hook dependency arrays for missing or unstable entries, and for effects that should be derived values instead.
          - Flag state that duplicates props or can be computed during render.
          - Flag missing cleanup in effects that subscribe, poll, or open connections.
          - Flag list rendering keyed by array index where a stable identifier exists.
          - Flag interactive elements without accessible names, and click handlers on non-interactive elements.
          - Flag inline object or function props passed to memoized children.
    - path: "**/api/**/*.ts"
      instructions: |
        API boundary code. Additionally:
          - Every request payload must be parsed with a schema validator before use; types alone do not validate.
          - Flag responses that echo internal error details, stack traces, or database identifiers unintentionally.
          - Check that authentication and authorization are enforced per route, not assumed from middleware ordering.
    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: |
        Review tests for value:
          - Assert on observable behavior, not on internal calls, unless the contract is the call itself.
          - Flag `.only`, empty test bodies, and assertions that can never fail.
          - Flag heavy mocking that would pass even if the implementation were deleted.
    - path: "**/*.{sql,prisma}"
      instructions: |
        Schema and query changes:
          - Flag migrations that lock large tables or drop columns without a documented deprecation path.
          - Check that new foreign keys and frequently filtered columns are indexed.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "wip"
    labels:
      - "!skip-review"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: true

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Conventional Commit style with a scope, for example 'feat(billing): add proration'. Under 72 characters."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "No public API break without a note"
        mode: "warning"
        instructions: |
          Fail if the pull request changes an exported type, function signature, or route contract
          under packages/ or apps/*/api/ and the description contains no "Breaking change" or
          "Migration" section explaining the upgrade path. Pass otherwise.

  tools:
    eslint:
      enabled: true
    biome:
      enabled: true
    oxc:
      enabled: true
    reactDoctor:
      enabled: true
    stylelint:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "docs/standards/**/*.md"
  web_search:
    enabled: true
