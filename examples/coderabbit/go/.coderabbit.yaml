# CodeRabbit configuration for a Go project
# Target: Go service or CLI with generated protobuf code and table-driven tests.
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: "Review as a senior Go engineer. Focus on error handling, concurrency and allocation; trust gofmt for style."

reviews:
  profile: "chill"
  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true

  path_filters:
    - "cmd/**"
    - "internal/**"
    - "pkg/**"
    - "!**/vendor/**"
    - "!**/*.pb.go"
    - "!**/*_generated.go"
    - "!**/mocks/**"
    - "!**/testdata/**"
    - "!go.sum"

  path_instructions:
    - path: "**/*.go"
      instructions: |
        Review this Go with these priorities:
          - Every returned error must be handled or deliberately ignored with a comment. Flag `_ = err`.
          - Require error wrapping that adds context: `fmt.Errorf("doing x: %w", err)`. Flag lost `%w`.
          - Flag `panic` in library code; reserve it for truly unrecoverable initialization.
          - Every `context.Context` should be the first parameter, propagated, and honored; flag `context.TODO()` in new code.
          - Flag goroutines with no clear lifetime owner, no cancellation path, or no way to observe failure.
          - Flag captured loop variables, unsynchronized shared state, and maps written from multiple goroutines.
          - Require `defer` for closing anything opened; flag `defer` inside a loop that should be a function call.
          - Flag interfaces defined by the implementer rather than the consumer, and single-implementation interfaces added speculatively.
          - Flag unnecessary allocations in hot paths: slice growth without capacity, repeated string concatenation.
    - path: "cmd/**/*.go"
      instructions: |
        Entry points. Additionally:
          - Flag configuration read directly from globals instead of being passed in.
          - Require a non-zero exit code on failure, and signal handling for graceful shutdown in long-running commands.
    - path: "internal/**/*.go"
      instructions: |
        Internal packages should stay internal:
          - Flag exported identifiers with no consumer outside the package.
          - Flag import cycles and packages that reach across bounded contexts.
    - path: "**/*_test.go"
      instructions: |
        Review tests for value:
          - Prefer table-driven tests; flag copy-pasted near-identical cases.
          - Flag `t.Parallel()` on tests that share mutable state.
          - Flag missing `t.Cleanup` where resources are created.
          - Flag `time.Sleep` used to synchronize; prefer channels, `sync.WaitGroup`, or `context` deadlines.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "wip"
    labels:
      - "!skip-review"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Prefix with the affected package, for example 'internal/billing: retry on 429'. Under 72 characters."
    description:
      mode: "warning"
    custom_checks:
      - name: "No new package without a doc comment"
        mode: "warning"
        instructions: |
          Fail if the pull request adds a new Go package directory whose files contain no
          package-level doc comment on any file. Pass otherwise.

  tools:
    golangci-lint:
      enabled: true
    buf:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    checkmake:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CONTRIBUTING.md"
      - "docs/conventions/**/*.md"
