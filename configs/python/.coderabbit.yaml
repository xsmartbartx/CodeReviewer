# CodeRabbit configuration for a Python project
# Target: application or service code with tests, migrations, and some notebooks.
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

tone_instructions: "Review as a senior Python engineer. Be direct about correctness and data-safety risks; leave formatting to the linters."

reviews:
  profile: "chill"
  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true

  path_filters:
    - "src/**"
    - "app/**"
    - "tests/**"
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/__pycache__/**"
    - "!**/*.egg-info/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/htmlcov/**"
    - "!**/*.ipynb"
    - "!poetry.lock"
    - "!uv.lock"

  path_instructions:
    - path: "**/*.py"
      instructions: |
        Review this Python with these priorities:
          - Flag bare `except:` and broad `except Exception` that swallow errors without re-raising or logging context.
          - Flag mutable default arguments, and shared mutable module-level state.
          - Require context managers for files, sockets, locks, and database sessions.
          - Flag string-built SQL and `subprocess` calls with `shell=True`; require parameter binding and argument lists.
          - Flag `assert` used for runtime validation in production paths; asserts can be stripped.
          - Prefer explicit type hints on public functions, and flag hints that contradict the implementation.
          - Point out N+1 query patterns and loops that issue one request or query per item.
          - Flag secrets and credentials that are not read from environment or a secrets manager.
    - path: "**/models*.py"
      instructions: |
        Data model changes. Additionally:
          - Check that validation runs before persistence, not after.
          - Flag new nullable columns with no default where downstream code assumes a value.
          - Check that frequently filtered or joined columns are indexed.
    - path: "**/migrations/**/*.py"
      instructions: |
        Migrations are the highest-risk files here:
          - Flag any migration that is not reversible, unless the description explains why.
          - Flag operations that rewrite or lock large tables without a documented rollout plan.
          - Flag data backfills executed inline in a schema migration.
    - path: "tests/**/*.py"
      instructions: |
        Review tests for value:
          - Assert on behavior; flag tests with no assertions.
          - Flag broad `except Exception` inside tests; a failure should surface, not be caught.
          - Flag `time.sleep` used for synchronization, and network calls to real services.
          - Test data is procedural and non-sensitive; do not flag it as a secret leak.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "wip"
    labels:
      - "!skip-review"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "warning"
      threshold: 70
    title:
      mode: "warning"
      requirements: "Describe the change, not the file. Use an imperative mood and stay under 72 characters."
    description:
      mode: "warning"
    custom_checks:
      - name: "Migration safety note"
        mode: "warning"
        instructions: |
          Fail if the pull request adds or edits a file under a migrations/ directory and the
          description has no section describing rollout and rollback. Pass otherwise.

  tools:
    ruff:
      enabled: true
    flake8:
      enabled: false
    pylint:
      enabled: false
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    sqlfluff:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/CONTRIBUTING.md"
      - "docs/style/**/*.md"
