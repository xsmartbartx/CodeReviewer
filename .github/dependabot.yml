version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (bundled by eslint-config-next) supports TypeScript < 6.1;
      # TypeScript 7 breaks lint. Lift this once eslint-config-next supports it.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Types must match the Node.js runtime (node:24 in the Dockerfile and CI).
      # Bump this together with the runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
